<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQA 創意思考引導系統</title>
    <!-- 引入 Tailwind CSS 提供極致精美的現代介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 向量圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=300;400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .step-transition {
            transition: all 0.3s ease-in-out;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-purple-50/40 min-h-screen py-8 px-4 md:py-12">

<div class="max-w-4xl mx-auto bg-white shadow-xl rounded-3xl p-6 md:p-10 border border-slate-100 relative">
    <!-- 系統標題 -->
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-700 tracking-tight flex items-center justify-center gap-2 mb-2">
            <i data-lucide="brain-circuit" class="text-indigo-600 w-8 h-8 md:w-10 md:h-10"></i>
            IQA 創意思考引導系統
        </h1>
        <p class="text-sm md:text-base text-slate-500 font-medium">免 API、免費用！運用 IQA 鷹架與 AI 協作，生成頂級「互動介面設計」專案計畫</p>
    </div>
    
    <!-- 5 步驟導航指標 (帶有 Lucide 圖示) -->
    <div id="nav-indicator" class="flex items-center justify-between mb-8 overflow-x-auto pb-4 border-b border-slate-100 custom-scrollbar">
        <!-- 由 JavaScript 動態繪製與更新 -->
    </div>

    <!-- 步驟主要內容 -->
    <div id="step-content" class="step-transition min-h-[350px] bg-slate-50/50 rounded-2xl border border-slate-100 p-6 md:p-8">
        <!-- 由 JS 渲染 -->
    </div>
</div>

<!-- 頂級自訂通知 Toast 視窗 -->
<div id="toast" class="fixed bottom-5 right-5 p-4 rounded-xl shadow-lg text-white font-bold flex items-center gap-2 transition-all duration-300 opacity-0 translate-y-2 pointer-events-none z-50 bg-emerald-600">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toast-text">複製成功！</span>
</div>

<!-- 智慧生成加載遮罩 -->
<div id="loader" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in">
    <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-xs text-center border border-indigo-50">
        <i data-lucide="loader-2" class="animate-spin text-indigo-600 w-12 h-12 mb-4"></i>
        <p id="loader-text" class="text-indigo-900 font-bold text-base">正在模擬處理中...</p>
        <p class="text-xs text-slate-400 mt-2">請稍候，正在為您快速組織創意思維...</p>
    </div>
</div>

<script>
    // 1. 全局狀態管理與模擬資料
    const mockKeywords = [
        "使用者旅程", "互動介面", "資訊架構", "手勢操作", "感知反饋",
        "高對比模式", "語音輔助", "UI設計系統", "Wireframe", "動態微交互",
        "跨世代介面", "卡片式排版", "視覺層級", "色彩心理學", "雙向配對",
        "響應式佈局", "觸覺震動", "引導教學", "無障礙設計", "可用性測試",
        "高擬真原型", "微型動畫", "情感化設計", "眼動追蹤", "極簡網格",
        "狀態回饋", "動態加載", "多路徑導覽", "任務流暢度", "彈出式提示",
        "深色模式", "大字體支援", "觸控目標", "拖曳元件", "實時同步",
        "體驗易用性", "認知負荷", "圖示化溝通", "對比比率", "熱點地圖",
        "行為召喚", "資訊降噪", "微秒級響應", "手風琴選單", "情感共鳴",
        "無縫轉場", "系統狀態提示", "數位無障礙", "卡片滑動", "成就解鎖"
    ];

    let state = {
        step: 1,
        topic: "",
        keywords: [],
        affinities: [],       // 結構: [{ category: "維度", items: ["關鍵字", ...] }]
        specificTheme: "",    // 核心主題
        
        // 針對「互動介面設計 (UI/UX)」重新定義的 9 大專案計畫書章節 (新增第九章視覺提示詞)
        summary: "",          // 一、專案摘要與設計願景
        background: "",       // 二、使用者痛點與介面需求分析
        persona: "",          // 三、資訊架構與介面流程設計
        valueProp: "",        // 四、視覺設計與介面設計系統 (Design System)
        blueprint: "",        // 五、核心互動機制與動效設計
        prototype: "",        // 六、原型開發與高低擬真測試規劃
        business: "",         // 七、系統架構、前端實施與無障礙設計
        timeline: "",         // 八、介面迭代時程與專案資源編制
        visualPrompt: ""      // 九、介面設計視覺風格與 AI 生成提示詞
    };

    // 2. 自訂 Toast 提示機制
    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toast-text');
        if (!toast || !toastText) return;
        toastText.innerText = msg;
        
        if (type === 'success') {
            toast.className = "fixed bottom-5 right-5 p-4 rounded-xl shadow-lg text-white font-bold flex items-center gap-2 transition-all duration-300 z-50 bg-emerald-600";
        } else {
            toast.className = "fixed bottom-5 right-5 p-4 rounded-xl shadow-lg text-white font-bold flex items-center gap-2 transition-all duration-300 z-50 bg-rose-600";
        }
        
        toast.classList.remove('opacity-0', 'translate-y-2');
        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-2');
        }, 3000);
    }

    // 3. 剪貼簿複製法
    function copyText(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('提示詞複製成功！請至 AI 平台貼上。');
        } catch (err) {
            showToast('複製失敗，請手動複製文字框內容。', 'error');
        }
        document.body.removeChild(textarea);
    }

    // 4. 智慧生成與更新 Prompt (為「互動介面設計」量身打造，擴充至 9 大章節)
    function generatePrompt1Text() {
        return `請針對介面設計主題『${state.topic || "【尚未填寫主題】"}』進行第一階段的設計思考發想。請扮演專業的交互質性分析（IQA）開放編碼專家，列出 50 個與此介面設計主題相關的具體 UI 元件、操作手勢、互動反饋、視覺風格、無障礙規範、情感聯想或介面易用性（Usability）關鍵字。

請務必嚴格以繁體中文半形逗號（,）分隔的形式回傳，不要有任何 Markdown 代碼包裝、標點符號或任何額外的解釋。格式例如：
關鍵字一,關鍵字二,關鍵字三`;
    }

    function generatePrompt2Text() {
        return `我目前手邊擁有關於介面設計專題『${state.topic}』的 50 個開放編碼關鍵字：
${state.keywords.join(', ')}

請扮演交互質性分析（IQA）的心智圖分析專家，進行「主軸編碼」與「歸納編碼」。請將這些關鍵字分類歸納為 4 個最核心的「互動介面設計創意維度（Affinities）」（例如：介面操作易用性、視覺與感知系統、互動流暢度、無障礙與情感共鳴）。

請務必嚴格以下列「中文條列格式」回傳（不要 JSON，不要任何 Markdown 標記，直接回傳純文字即可）：

維度一：關鍵字A, 關鍵字B, 關鍵字C
維度二：關鍵字D, 關鍵字E
維度三：關鍵字F, 關鍵字G
維度四：關鍵字H, 關鍵字I`;
    }

    function generatePrompt3Text() {
        return `我目前準備發展一個名為『${state.specificTheme || "【請輸入核心介面專案名稱】"}』的互動介面設計（UI/UX）與數位原型專案。本專案經過 IQA 心智圖收斂後的維度結構如下：
${state.affinities.map(a => `- ${a.category}：${a.items.join(', ')}`).join('\n')}

請扮演資神的「互動介面設計顧問 (Lead UI/UX Designer)」與「專案計畫書專家」，以此主題與維度架構為核心，為我產出「可供正式提案」的專業「互動介面設計專案計畫書」。請務必嚴格以下列「中文標籤標題」回傳（不要 Markdown，不要 JSON，確保段落扎實、採用 UI/UX 專業術語且符合正式提案水準）：

【一、專案摘要與設計願景】
（寫一段約 250 字的介面計畫摘要，描述設計願景、產品核心功能與 30 秒電梯簡報亮點）

【二、使用者痛點與介面需求分析】
（深入闡述此主題在使用體驗上的痛點、傳統介面之障礙，以及使用者介面需求分析）

【三、資訊架構與介面流程設計】
（描繪系統的資訊架構 IA、核心導覽邏輯，以及關鍵畫面流動 User Flow）

【四、視覺設計與介面設計系統】
（定義介面視覺風格、色彩心理學應用、網格系統與核心設計系統 Design System / UI Style Guide 規範）

【五、核心互動機制與動效設計】
（詳細描述關鍵互動機制、操作手勢設計，以及提升易用性與系統狀態反饋之「微交互動效 Micro-interactions」）

【六、原型開發與高低擬真測試規劃】
（說明如何設計 Wireframe、Lo-Fi & Hi-Fi 互動原型，以及如何安排可用性測試 Usability Testing 並追蹤關鍵任務流暢度與 NPS 評估指標）

【七、系統架構、前端實施與無障礙設計】
（規劃本專案的技術堆疊，並深入探討符合數位無障礙規範 Accessibility / WCAG 之高齡或跨世代介面友善設計）

【八、介面迭代時程與專案資源編制】
（列出執行此互動介面設計專案的迭代時程、甘特圖時序，以及設計團隊所需之跨領域專業角色編制，如 UI/UX 設計師、使用者研究員、前端開發工程師）

【九、介面設計視覺風格與 AI 生成提示詞】
（針對本專案的介面風格定位，精心撰寫一段專屬的 Midjourney 或 DALL-E 3 英文與中文影像生成提示詞 Prompt，描述其色彩計畫、網格系統、Glassmorphism / Neumorphism 等前沿材質、高擬真 Figma Showcase 排版方式，讓讀者能一鍵複製生成高質感介面設計視覺圖）`;
    }

    // 5. 渲染導航
    function render() {
        const steps = [
            { id: 1, n: "探索", i: "search" },
            { id: 2, n: "編碼", i: "pen-tool" },
            { id: 3, n: "心智圖", i: "git-branch" },
            { id: 4, n: "介面流程", i: "panels-top-left" },
            { id: 5, n: "計畫書", i: "file-text" }
        ];

        document.getElementById('nav-indicator').innerHTML = steps.map((s, idx) => `
            <div class="flex items-center flex-shrink-0">
                <div class="flex flex-col items-center mx-2 ${state.step >= s.id ? 'text-indigo-600' : 'text-slate-400'}">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center transition-all duration-300 ${state.step >= s.id ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' : 'bg-slate-100'}">
                        <i data-lucide="${s.i}" class="w-5 h-5"></i>
                    </div>
                    <span class="text-xs mt-2 font-bold">${s.n}</span>
                </div>
                ${idx < 4 ? '<i data-lucide="chevron-right" class="text-slate-300 mx-2"></i>' : ''}
            </div>
        `).join('');

        const container = document.getElementById('step-content');

        // Step 1 UI - 生成 50 個關鍵字
        if (state.step === 1) {
            container.innerHTML = `
                <div class="space-y-4 animate-fade-in">
                    <h2 class="font-bold text-xl text-slate-800 flex items-center gap-2">
                        <i data-lucide="sparkles" class="text-indigo-500"></i> 1. 確立介面探索領域
                    </h2>
                    <p class="text-slate-500 text-sm">請輸入您想發展或探索的「互動介面設計」專案方向：</p>
                    <textarea id="topic" class="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none text-slate-700 shadow-sm transition" rows="2" placeholder="例如：青銀共存高齡友善社區共融行動 App 與智慧手勢介面設計" oninput="updatePrompt1()">${state.topic}</textarea>
                    
                    <!-- AI 提示詞產出區 -->
                    <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100/50 mt-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-indigo-700 flex items-center gap-1">
                                <i data-lucide="terminal" class="w-4 h-4"></i> 第一步 IQA 開放編碼 AI 提示詞
                            </span>
                            <button onclick="copyPrompt('p1-text')" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 shadow-sm transition">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i> 一鍵複製提示詞
                            </button>
                        </div>
                        <p id="p1-text" class="text-xs text-slate-600 leading-relaxed bg-white p-3 rounded-lg border border-indigo-100 select-all max-h-24 overflow-y-auto">${generatePrompt1Text()}</p>
                    </div>

                    <!-- AI 平台傳送門 -->
                    ${renderAiPortals()}

                    <!-- 匯入貼上區 -->
                    <div class="bg-slate-100/50 p-4 rounded-xl border mt-4">
                        <label class="block text-sm font-bold text-slate-700 mb-2">💾 請貼上 AI 生成的 50 個介面關鍵字（以逗號分隔）：</label>
                        <textarea id="keywords-paste" class="w-full p-3 bg-white border rounded-xl text-xs outline-none focus:ring-1 focus:ring-indigo-500" rows="3" placeholder="例如：使用者旅程, 互動介面, 手勢操作, 無障礙設計, 高擬真原型..."></textarea>
                        <div class="flex gap-3 mt-3">
                            <button onclick="importKeywords()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition flex items-center justify-center gap-1.5 shadow-md">
                                <i data-lucide="import" class="w-4 h-4"></i> 匯入貼上並進入第二步
                            </button>
                            <button onclick="simulateStep1()" class="bg-slate-700 hover:bg-slate-800 text-white px-5 rounded-xl text-sm font-bold transition">
                                ⚡ 免 AI 快速模擬體驗
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        // Step 2 UI - 歸納 4 大維度
        else if (state.step === 2) {
            container.innerHTML = `
                <div class="space-y-4 animate-fade-in">
                    <h2 class="font-bold text-xl text-slate-800 flex items-center gap-2">
                        <i data-lucide="tag" class="text-purple-500"></i> 2. IQA 介面開放編碼結果 (${state.keywords.length} 個關鍵字)
                    </h2>
                    <p class="text-slate-500 text-sm">你可以點選卡片上的叉叉刪除，或在最下方手動追加新介面概念。</p>
                    
                    <div class="flex flex-wrap gap-1.5 max-h-56 overflow-y-auto p-3 bg-white border rounded-xl custom-scrollbar">
                        ${state.keywords.map((k, i) => `
                            <span class="inline-flex items-center bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full text-xs font-semibold border border-indigo-100/50 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 transition-colors">
                                ${k}
                                <button onclick="removeKeyword(${i})" class="ml-1 text-indigo-400 hover:text-rose-500 transition-colors">
                                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                </button>
                            </span>
                        `).join('')}
                    </div>

                    <div class="flex gap-2 bg-slate-100/50 p-1.5 rounded-xl">
                        <input id="custom-keyword" class="flex-1 p-2 bg-white border rounded-lg text-sm focus:outline-none" placeholder="自訂追加介面編碼關鍵字...">
                        <button onclick="addCustomKeyword()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition">追加</button>
                    </div>

                    <!-- AI 提示詞產出區 -->
                    <div class="bg-purple-50/50 p-4 rounded-xl border border-purple-100/50 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-purple-700 flex items-center gap-1">
                                <i data-lucide="terminal" class="w-4 h-4"></i> 第二步 IQA 介面心智圖分類 AI 提示詞
                            </span>
                            <button onclick="copyPrompt('p2-text')" class="text-xs bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 shadow-sm transition">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i> 一鍵複製提示詞
                            </button>
                        </div>
                        <p id="p2-text" class="text-xs text-slate-600 leading-relaxed bg-white p-3 rounded-lg border border-purple-100 select-all max-h-24 overflow-y-auto whitespace-pre-line">${generatePrompt2Text()}</p>
                    </div>

                    <!-- AI 平台傳送門 -->
                    ${renderAiPortals()}

                    <!-- 匯入貼上區 -->
                    <div class="bg-slate-100/50 p-4 rounded-xl border">
                        <label class="block text-sm font-bold text-slate-700 mb-2">💾 請貼上 AI 歸納後的純文字維度清單：</label>
                        <textarea id="affinities-paste" class="w-full p-3 bg-white border rounded-xl text-xs outline-none focus:ring-1 focus:ring-indigo-500" rows="4" placeholder="格式如：&#10;介面操作易用性：大字體支援, 觸控目標, 拖曳元件&#10;視覺與感知系統：高對比模式, 視覺層級,色彩心理學&#10;..."></textarea>
                        <div class="flex gap-3 mt-3">
                            <button onclick="importAffinities()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-bold transition flex items-center justify-center gap-1.5 shadow-md">
                                <i data-lucide="import" class="w-4 h-4"></i> 匯入心智圖並進入第三步
                            </button>
                            <button onclick="simulateStep2()" class="bg-slate-700 hover:bg-slate-800 text-white px-5 rounded-xl text-sm font-bold transition">
                                ⚡ 快速模擬體驗
                            </button>
                            <button onclick="backStep(1)" class="border border-slate-200 hover:bg-slate-50 text-slate-600 px-4 rounded-xl text-sm font-bold transition">返回</button>
                        </div>
                    </div>
                </div>`;
        }

        // Step 3 UI - 寫介面計畫書與分析（改版為「互動介面設計」專屬 9 大章節）
        else if (state.step === 3) {
            container.innerHTML = `
                <div class="space-y-4 animate-fade-in">
                    <h2 class="font-bold text-xl text-slate-800 flex items-center gap-2">
                        <i data-lucide="git-pull-request" class="text-pink-500"></i> 3. 創意介面心智圖架構 (Affinities)
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-56 overflow-y-auto pr-1 custom-scrollbar">

    // 8. 資料匯入與中文文本智慧解析邏輯 (解析 9 大章節)
    function importKeywords() {
        const val = document.getElementById('keywords-paste').value.trim();
        if (!val) {
            showToast("請貼上 AI 生成的 50 個關鍵字！", "error");
            return;
        }
        const kws = val.split(/[,，、\s\n]+/).map(k => k.trim()).filter(k => k !== '');
        if (kws.length < 5) {
            showToast("關鍵字太少或格式不對，請確保以逗號分隔！", "error");
            return;
        }
        state.keywords = kws;
        state.step = 2;
        render();
        showToast("50 組創意介面關鍵字解析匯入成功！");
    }

    function importAffinities() {
        const val = document.getElementById('affinities-paste').value.trim();
        if (!val) {
            showToast("請貼上 AI 分析回傳的心智圖清單！", "error");
            return;
        }
        
        const lines = val.split('\n').map(l => l.trim()).filter(l => l !== '');
        const affinities = [];
        
        lines.forEach(line => {
            const colonIdx = line.indexOf('：') !== -1 ? line.indexOf('：') : line.indexOf(':');
            if (colonIdx !== -1) {
                let category = line.substring(0, colonIdx).trim();
                category = category.replace(/^\d+[\.\、\s]*/, '').replace(/^[-*+\s]*/, '').replace(/^[一二三四五六七八九十]+、/, '').trim();
                
                const itemsStr = line.substring(colonIdx + 1).trim();
                const items = itemsStr.split(/[,，、\s]+/).map(i => i.trim()).filter(i => i !== '');
                
                if (category && items.length > 0) {
                    affinities.push({ category, items });
                }
            }
        });

        if (affinities.length === 0) {
            showToast("解析失敗，請確保每一行的格式類似「介面操作易用性：大字體支援, 拖曳元件」", "error");
            return;
        }
        
        state.affinities = affinities;
        state.step = 3;
        render();
        showToast("心智圖維度解析匯入成功！");
    }

    // 🧠 智慧計畫書 9 大段落中文文本解析器 (整合高容錯、智慧型中文文本解析演算法)
    function importStory() {
        const val = document.getElementById('story-paste').value.trim();
        if (!val) {
            showToast("請貼上 AI 生成的介面設計與解決方案！", "error");
            return;
        }

        const lines = val.split('\n');
        let summaryContent = "";
        let backgroundContent = "";
        let personaContent = "";
        let valuePropContent = "";
        let blueprintContent = "";
        let prototypeContent = "";
        let businessContent = "";
        let timelineContent = "";
        let visualPromptContent = "";
        let currentHeader = "";
        
        // 更健全且高容錯的標題偵測機制
        function detectHeader(line) {
            const l = line.trim();
            if (l.length > 50) return null; // 標題行不應超過 50 字，有效防止內文高頻字誤判

            // 移除行首標記、Markdown 標籤、星號與括號等，將文字正規化便於匹配
            const clean = l.replace(/[\*#_\[\]【】\-\s\d\.\、]/g, "");

            // 一、專案摘要與設計願景
            if (clean.includes("專案摘要") || clean.includes("設計願景") || clean.includes("核心概念")) {
                return "summary";
            }
            // 二、使用者痛點與介面需求分析
            if (clean.includes("痛點分析") || clean.includes("需求分析") || clean.includes("痛點與介面")) {
                return "background";
            }
            // 三、資訊架構與介面流程設計
            if (clean.includes("資訊架構") || clean.includes("流程設計") || clean.includes("介面流程") || clean.includes("UserFlow")) {
                return "persona";
            }
            // 四、視覺設計與介面設計系統 (Design System)
            if (clean.includes("視覺設計") || clean.includes("設計系統") || clean.includes("StyleGuide") || clean.includes("DesignSystem")) {
                return "valueProp";
            }
            // 五、核心互動機制與動效設計
            if (clean.includes("互動機制") || clean.includes("動效設計") || clean.includes("手勢設計") || clean.includes("微交互")) {
                return "blueprint";
            }
            // 六、原型開發與高低擬真測試規劃
            if (clean.includes("原型開發") || clean.includes("測試規劃") || clean.includes("擬真測試") || clean.includes("可用性測試")) {
                return "prototype";
            }
            // 七、系統架構、前端實施與無障礙設計
            if (clean.includes("系統架構") || clean.includes("前端實施") || clean.includes("無障礙") || clean.includes("WCAG")) {
                return "business";
            }
            // 八、介面迭代時程與專案資源編制
            if (clean.includes("迭代時程") || clean.includes("資源編制") || clean.includes("甘特") || clean.includes("時程與資源")) {
                return "timeline";
            }
            // 九、介面設計視覺風格與 AI 生成提示詞
            if (clean.includes("風格與AI") || clean.includes("生成提示詞") || clean.includes("影像生成") || clean.includes("視覺風格") || clean.includes("AI生成") || clean.includes("Midjourney") || clean.includes("DALL")) {
                return "visualPrompt";
            }

            // 備用匹配：如果使用者刪改了標題文字，則改用行首的數字序號比對
            const cleanWithNum = l.replace(/[\*#_\[\]【】\-\s]/g, "");
            if (cleanWithNum.match(/^[一1I]、/) || cleanWithNum.startsWith("第一章") || cleanWithNum.startsWith("第一、") || cleanWithNum.startsWith("1.")) return "summary";
            if (cleanWithNum.match(/^[二2]、/) || cleanWithNum.startsWith("第二章") || cleanWithNum.startsWith("第二、") || cleanWithNum.startsWith("2.")) return "background";
            if (cleanWithNum.match(/^[三3]、/) || cleanWithNum.startsWith("第三章") || cleanWithNum.startsWith("第三、") || cleanWithNum.startsWith("3.")) return "persona";
            if (cleanWithNum.match(/^[四4]、/) || cleanWithNum.startsWith("第四章") || cleanWithNum.startsWith("第四、") || cleanWithNum.startsWith("4.")) return "valueProp";
            if (cleanWithNum.match(/^[五5]、/) || cleanWithNum.startsWith("第五章") || cleanWithNum.startsWith("第五、") || cleanWithNum.startsWith("5.")) return "blueprint";
            if (cleanWithNum.match(/^[六6]、/) || cleanWithNum.startsWith("第六章") || cleanWithNum.startsWith("第六、") || cleanWithNum.startsWith("6.")) return "prototype";
            if (cleanWithNum.match(/^[七7]、/) || cleanWithNum.startsWith("第七章") || cleanWithNum.startsWith("第七、") || cleanWithNum.startsWith("7.")) return "business";
            if (cleanWithNum.match(/^[八8]、/) || cleanWithNum.startsWith("第八章") || cleanWithNum.startsWith("第八、") || cleanWithNum.startsWith("8.")) return "timeline";
            if (cleanWithNum.match(/^[九9]、/) || cleanWithNum.startsWith("第九章") || cleanWithNum.startsWith("第九、") || cleanWithNum.startsWith("9.")) return "visualPrompt";

            return null;
        }

        lines.forEach(line => {
            const detected = detectHeader(line);
            if (detected) {
                currentHeader = detected;
            } else if (currentHeader && line.trim() !== "") {
                // 將內容收集至相應的變數
                if (currentHeader === "summary") summaryContent += line + "\n";
                else if (currentHeader === "background") backgroundContent += line + "\n";
                else if (currentHeader === "persona") personaContent += line + "\n";
                else if (currentHeader === "valueProp") valuePropContent += line + "\n";
                else if (currentHeader === "blueprint") blueprintContent += line + "\n";
                else if (currentHeader === "prototype") prototypeContent += line + "\n";
                else if (currentHeader === "business") businessContent += line + "\n";
                else if (currentHeader === "timeline") timelineContent += line + "\n";
                else if (currentHeader === "visualPrompt") visualPromptContent += line + "\n";
            }
        });
        
        const summary = summaryContent.trim();
        if (!summary) {
            showToast("解析失敗！未能辨識出【一、專案摘要與設計願景】。請確認貼上的文字開頭含有該標題，或採用標準一、二、三、序號標註。", "error");
            return;
        }
        
        state.summary = summary;
        state.background = backgroundContent.trim() || "無提供使用者痛點與介面需求分析。";
        state.persona = personaContent.trim() || "無提供資訊架構與介面流程設計。";
        state.valueProp = valuePropContent.trim() || "無提供視覺設計與介面設計系統。";
        state.blueprint = blueprintContent.trim() || "無提供核心互動機制與動效設計。";
        state.prototype = prototypeContent.trim() || "無提供原型開發與高低擬真測試規劃。";
        state.business = businessContent.trim() || "無提供系統架構、前端實施與無障礙設計。";
        state.timeline = timelineContent.trim() || "無提供介面迭代時程與專案資源編制。";
        state.visualPrompt = visualPromptContent.trim() || "無提供介面設計視覺風格與 AI 生成提示詞。";
        
        state.step = 4;
        render();
        showToast("9 大介面設計章節計畫草案解析匯入成功！");
    }
